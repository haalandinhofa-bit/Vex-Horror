plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// Decode the user-provided Blockbench PNG texture before resource processing.
tasks.register('decodeBlackFogTexture') {
    inputs.file('src/main/resources/assets/theblackfog/textures/entity/black_fog.png.b64')
    outputs.file('src/main/resources/assets/theblackfog/textures/entity/black_fog.png')
    doLast {
        def encoded = file('src/main/resources/assets/theblackfog/textures/entity/black_fog.png.b64')
        def decoded = file('src/main/resources/assets/theblackfog/textures/entity/black_fog.png')
        decoded.parentFile.mkdirs()
        decoded.bytes = java.util.Base64.decoder.decode(encoded.text.trim())
    }
}
processResources.dependsOn tasks.named('decodeBlackFogTexture')
